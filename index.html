<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gillhead Pond Optimizer™</title>
<style.css
</head>
<body>

<header>
    images/gillhead-logo.png
    <h1>Gillhead Pond Optimizer™</h1>
    <p>Build Bigger Bass.</p>
</header>

<section class="hero">
    <div class="hero-overlay">
        <h2>Free Pond Audit</h2>
        <p>Discover what's limiting trophy bass growth.</p>
    </div>
</section>

<div class="container">

    <div class="card">

        <h2>Pond Information</h2>

        <label>Aeration</label>
        <select id="aeration">
            <option value="0">No</option>
            <option value="10">Yes</option>
        </select>

        <label>Water Clarity</label>
        <select id="clarity">
            <option value="2">Muddy</option>
            <option value="6">Very Clear</option>
            <option value="10">18-30 Inch Bloom</option>
        </select>

        <label>Bluegill Population</label>
        <select id="bluegill">
            <option value="2">Poor</option>
            <option value="10">Average</option>
            <option value="20">Excellent</option>
        </select>

        <label>Feed Program</label>
        <select id="feed">
            <option value="0">None</option>
            <option value="5">Occasional</option>
            <option value="10">Daily</option>
        </select>

        <label>Threadfin Shad</label>
        <select id="shad">
            <option value="0">No</option>
            <option value="10">Yes</option>
        </select>

        <label>Brush Piles</label>
        <select id="brush">
            <option value="0">None</option>
            <option value="5">Some</option>
            <option value="10">Many</option>
        </select>

        <label>Gravel Beds</label>
        <select id="gravel">
            <option value="0">None</option>
            <option value="5">Some</option>
            <option value="10">Many</option>
        </select>

        <label>Bass Condition</label>
        <select id="bass">
            <option value="0">Skinny</option>
            <option value="10">Average</option>
            <option value="20">Fat</option>
        </select>

        <label>Largest Bass Caught</label>
        <select id="largest">
            <option value="0">Below 3 lbs</option>
            <option value="5">3-5 lbs</option>
            <option value="10">5-8 lbs</option>
            <option value="15">8-10 lbs</option>
            <option value="20">10+ lbs</option>
        </select>

        <button onclick="calculate()">
            Run Gillhead Audit
        </button>

    </div>

    <div id="results" class="card results">

        <h2>Gillhead Lake Score™</h2>

        <div id="score" class="score">0/100</div>

        <div id="grade"></div>
        <div id="factor"></div>
        <div id="recommendation"></div>
        <div id="forecast"></div>

    </div>

</div>

<script>

function calculate(){

let water =
Number(aeration.value) +
Number(clarity.value);

let forage =
Number(bluegill.value) +
Number(feed.value) +
Number(shad.value);

let habitat =
Number(brush.value) +
Number(gravel.value);

let bass =
Number(document.getElementById("bass").value) +
Number(largest.value);

let total =
water + forage + habitat + bass;

if(total > 100){
    total = 100;
}

let grade;

if(total >= 90){
    grade = "Trophy Bass Factory";
}
else if(total >= 80){
    grade = "Excellent";
}
else if(total >= 65){
    grade = "Good";
}
else if(total >= 50){
    grade = "Fair";
}
else{
    grade = "Needs Work";
}

let lowest =
Math.min(water, forage, habitat, bass);

let factor = "";
let recommendation = "";

if(lowest === forage){
    factor = "Forage Base";
    recommendation =
    "Feed bluegill daily and increase forage production.";
}
else if(lowest === habitat){
    factor = "Habitat";
    recommendation =
    "Add brush piles, gravel beds, and structure.";
}
else if(lowest === water){
    factor = "Water Quality";
    recommendation =
    "Evaluate lime, fertility, and aeration.";
}
else{
    factor = "Bass Population";
    recommendation =
    "Remove small bass and improve forage.";
}

let trophy =
(4 + total / 12).toFixed(1);

document.getElementById("results").style.display = "block";

document.getElementById("score").innerHTML =
total + "/100";

document.getElementById("grade").innerHTML =
"<strong>Grade:</strong> " + grade;

document.getElementById("factor").innerHTML =
"<strong>Limiting Factor:</strong> " + factor;

document.getElementById("recommendation").innerHTML =
"<strong>Top Recommendation:</strong> " + recommendation;

document.getElementById("forecast").innerHTML =
"<strong>Trophy Potential:</strong> " +
trophy + " lb bass";

}

</script>

</body>
</html>
